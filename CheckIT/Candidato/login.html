<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check IT - Inicio de Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">
    <link href="../css/styles.css" rel="stylesheet">
</head>

<body class="login-page">
    <div class="container">
        <div class="login-form">
            <img src="imagen/lg-checkIT.png" alt="Logotipo de Check IT">
            <input type="email" placeholder="Correo electrónico" required>
            <input type="password" placeholder="Contraseña" required>
            <div class="login-options">
                <div>
                    <input type="checkbox" id="keep-logged">
                    <label for="keep-logged">Mantener la sesión iniciada</label>
                </div>
                <a href="#">Olvidé mi contraseña</a>
            </div>
            <button>Iniciar Sesión</button>
        </div>
        <div class="image-section"></div>
    </div>
</body>
</html>
