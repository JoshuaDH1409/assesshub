<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssessHub — Inicio de sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto:wght@400&display=swap" rel="stylesheet">
    <link href="../css/styles.css" rel="stylesheet">
</head>

<body class="login-page">
    <div class="container">
        <div class="login-form">
            <img src="../imagen/logo-assesshub.svg" alt="AssessHub">
            <p class="brand-sub">Acceso para candidatos</p>
            <input type="email" placeholder="Correo electrónico" required>
            <input type="password" placeholder="Contraseña" required>
            <div class="login-options">
                <div>
                    <input type="checkbox" id="keep-logged">
                    <label for="keep-logged">Mantener la sesión iniciada</label>
                </div>
                <a href="#">Olvidé mi contraseña</a>
            </div>
            <button type="button">Iniciar sesión</button>
        </div>
        <div class="image-section"></div>
    </div>
</body>
</html>
